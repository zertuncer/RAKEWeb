    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        content="RAKE - Gelişmiş robotik araç platformu. Lidar, stereo kamera ve otonom sürüş teknolojileriyle donatılmış yeni nesil keşif robotu.">
    <title>RAKE — Robotik Araç Keşif Platformu</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"

    <header id="main-header">
        <nav class="header-left-nav" style="display: flex; align-items: center;">

<section id="basvuru-section" class="takimimiz-page" >

        <div class="team-section-light">
            <div class="team-container basvuru-container">
                <div class="basvuru-form-container">
                    <h2 class="main-heading basvuru-heading">Bize Katıl</h2>
                    <form id="native-apply-form" class="basvuru-form">
                        <!-- Kişisel Bilgiler -->
                        <div class="form-group">
                            <label for="fullName">Ad Soyad</label>
                            <input type="text" id="fullName" name="fullName" class="form-control" required
                                placeholder="Örn: Ahmet Yılmaz">
                        </div>
                        <div class="form-group">
                            <label for="email">E-posta Adresi</label>
                            <input type="email" id="email" name="email" class="form-control" required
                                placeholder="Örn: ahmet@itu.edu.tr">
                        </div>
                        <div class="form-group">
                            <label for="phone">Telefon Numarası</label>
                            <input type="tel" id="phone" name="phone" class="form-control" required
                                placeholder="Örn: 0555 555 5555">
                        </div>
                        <div class="form-group">
                            <label for="department">Sınıf / Bölüm</label>
                            <input type="text" id="department" name="department" class="form-control" required
                                placeholder="Örn: Makine Mühendisliği / 2. Sınıf">
                        </div>

                        <!-- Ekip Seçimi -->
                        <div class="form-group">
                            <label for="team-select">Başvurmak İstediğiniz Ekibi Seçiniz</label>
                            <select id="team-select" name="team" class="form-control" required style="cursor: pointer;">
                                <option value="" disabled selected>Lütfen bir ekip seçin...</option>
                                <option value="Mekanik">Mekanik Ekibi</option>
                                <option value="Elektronik">Elektronik Ekibi</option>
                                <option value="Yazılım">Yazılım Ekibi</option>
                                <option value="Organizasyon">Organizasyon Ekibi</option>
                            </select>
                        </div>

                        <!-- Ortak Sorular -->
                        <div id="common-questions"
                            style="display: none; border-top: 1px solid #e4e4e7; margin-top: 2rem; padding-top: 1.5rem;">

                            <div class="form-group">
                                <label for="qReason">İTÜ RAKE'yi tercih etme sebebiniz nedir?</label>
                                <textarea id="qReason" name="qReason" class="form-control" rows="3"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="qCareer">Kariyerinize hangi işi yaparak devam etmek istiyorsunuz?</label>
                                <textarea id="qCareer" name="qCareer" class="form-control" rows="3"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="qProgram">Önümüzdeki dönemde aşağıda bulunan programlardan birini yapmayı
                                    planlıyorsanız işaretleyiniz.</label>
                                <select id="qProgram" name="qProgram" class="form-control">
                                    <option value="" disabled selected>Seçim yapınız...</option>
                                    <option value="Erasmus">Erasmus</option>
                                    <option value="Work and Travel">Work and Travel</option>
                                    <option value="Uzun Dönem Staj / Part-time">Uzun Dönem Staj / Part-time</option>
                                    <option value="Yaz Dönemi Stajı">Yaz Dönemi Stajı</option>
                                    <option value="Hiçbiri">Hiçbiri</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="qClubs">Halihazırda devam ettiğiniz veya katılmak istediğiniz bir
                                    organizasyon, proje takımı, öğrenci kulübü var mı?</label>
                                <textarea id="qClubs" name="qClubs" class="form-control" rows="2"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="qTime">Takıma haftada kaç gün vakit ayırabilirsiniz?</label>
                                <select id="qTime" name="qTime" class="form-control">
                                    <option value="" disabled selected>Seçim yapınız...</option>
                                    <option value="1 gün">1 gün</option>
                                    <option value="1-2 gün">1-2 gün</option>
                                    <option value="3-4 gün">3-4 gün</option>
                                    <option value="5-6 gün">5-6 gün</option>
                                    <option value="7 gün">7 gün</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="qWeekend">Hafta sonları yapılacak çalışmalara katılabilir misiniz? Hayır ise
                                    neden?</label>
                                <textarea id="qWeekend" name="qWeekend" class="form-control" rows="2"></textarea>
                            </div>
                        </div>

                        <!-- Mekanik Ekibi Soruları -->
                        <div id="questions-Mekanik" class="team-questions"
                            style="display: none; border-top: 1px solid #e4e4e7; margin-top: 1.5rem; padding-top: 1.5rem;">

                            <div class="form-group">
                                <label for="qMekanikTasarim">Daha önce bir tasarım tecrübeniz oldu mu? Olduysa
                                    yaptığınız tasarımdan bahsedebilir misiniz?</label>
                                <textarea id="qMekanikTasarim" name="qMekanikTasarim" class="form-control"
                                    rows="3"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="qMekanikCad">Bilgisayar destekli tasarım (Fusion360, Solidworks vb.)
                                    programlarında deneyiminiz veya ilginiz var mı?</label>
                                <textarea id="qMekanikCad" name="qMekanikCad" class="form-control" rows="2"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="qMekanikUretim">Üretim teknikleri (talaşlı imalat, eklemeli imalat vb.)
                                    hakkında bilginiz veya deneyiminiz var mı?</label>
                                <textarea id="qMekanikUretim" name="qMekanikUretim" class="form-control"
                                    rows="2"></textarea>
                            </div>
                        </div>

                        <!-- Yazılım Ekibi Soruları -->
                        <div id="questions-Yazılım" class="team-questions"
                            style="display: none; border-top: 1px solid #e4e4e7; margin-top: 1.5rem; padding-top: 1.5rem;">

                            <div class="form-group">
                                <label for="qYazilimDiller">Yazılım dilleri hakkında bilgi ve deneyimleriniz
                                    nelerdir?</label>
                                <textarea id="qYazilimDiller" name="qYazilimDiller" class="form-control"
                                    rows="3"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="qYazilimLinux">Linux işletim sistemi hakkında bilgi ve deneyiminiz var
                                    mı?</label>
                                <textarea id="qYazilimLinux" name="qYazilimLinux" class="form-control"
                                    rows="2"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="qYazilimRos">Neden robotları programlarken ROS'a ihtiyaç duyuyoruz? Kısaca
                                    açıklayınız.</label>
                                <textarea id="qYazilimRos" name="qYazilimRos" class="form-control" rows="3"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="qYazilimGithub">Github hesabınızın linkini paylaşınız.</label>
                                <input type="url" id="qYazilimGithub" name="qYazilimGithub" class="form-control"
                                    placeholder="https://github.com/username">
                            </div>
                        </div>

                        <!-- Elektronik Ekibi Soruları -->
                        <div id="questions-Elektronik" class="team-questions"
                            style="display: none; border-top: 1px solid #e4e4e7; margin-top: 1.5rem; padding-top: 1.5rem;">

                            <div class="form-group">
                                <label for="qElektronikGomulu">Gömülü sistem programlama ve C/C++ dillerine ne kadar
                                    hakimsiniz?</label>
                                <textarea id="qElektronikGomulu" name="qElektronikGomulu" class="form-control"
                                    rows="2"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="qElektronikPcb">PCB tasarımı ve tasarım programlarına (Altium, KiCad vb.) ne
                                    kadar hakimsiniz?</label>
                                <textarea id="qElektronikPcb" name="qElektronikPcb" class="form-control"
                                    rows="2"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="qElektronikDonanim">Daha önce herhangi bir geliştirme kartı ya da
                                    mikrokontrolcü (Arduino, STM32 vb.) kullandınız mı?</label>
                                <textarea id="qElektronikDonanim" name="qElektronikDonanim" class="form-control"
                                    rows="3"></textarea>
                            </div>
                        </div>

                        <!-- Organizasyon Ekibi Soruları -->
                        <div id="questions-Organizasyon" class="team-questions"
                            style="display: none; border-top: 1px solid #e4e4e7; margin-top: 1.5rem; padding-top: 1.5rem;">

                            <div class="form-group">
                                <label for="qOrgDeneyim">Daha önce etkinlik yönetimi, sponsorluk veya sosyal medya
                                    yönetimi gibi alanlarda görev aldınız mı?</label>
                                <textarea id="qOrgDeneyim" name="qOrgDeneyim" class="form-control" rows="3"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="qOrgNeden">Neden organizasyon ekibine katılmak istiyorsunuz ve takıma neler
                                    katabileceğinizi düşünüyorsunuz?</label>
                                <textarea id="qOrgNeden" name="qOrgNeden" class="form-control" rows="3"></textarea>
                            </div>
                        </div>

                        <div id="form-message"
                            style="display: none; padding: 1rem; border-radius: 8px; margin-top: 1rem; text-align: center; font-weight: 500;">
                        </div>

                        <button type="submit" id="btn-submit-form" class="btn btn-primary basvuru-submit"
                            style="display: none; margin-top: 1rem; width: 100%;">Başvuruyu Gönder</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

                <div class="footer-contact">

                        <a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24">

                                    d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z" />

<script src="js/custom-select.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
